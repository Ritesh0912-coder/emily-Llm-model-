# Emily SLM — Base Configuration
# ~85M parameters | 8 layers | 512 hidden | 8 heads
# Purpose: Baseline research model (16-24GB VRAM, ~1-2 days)

model:
  name: emily-base
  vocab_size: 32000
  context_length: 1024
  d_model: 512
  n_heads: 8
  n_kv_heads: 4          # GQA: 4 KV heads, 8 query heads
  n_layers: 8
  d_ff: 2048             # 4 * d_model
  dropout: 0.1
  attention_type: flash   # Use Flash Attention if available
  tie_embeddings: true
  use_rms_norm: true
  use_swiglu: true
  use_rope: true
  rope_base: 10000
  max_seq_len: 1024

tokenizer:
  model_type: bpe
  vocab_size: 32000
  model_path: checkpoints/emily-base/tokenizer.json
  pad_token: "<|pad|>"
  eos_token: "<|eos|>"
  bos_token: "<|bos|>"
  unk_token: "<|unk|>"

training:
  batch_size: 32
  gradient_accumulation_steps: 4
  max_steps: 100000
  eval_interval: 2000
  save_interval: 5000
  log_interval: 100
  learning_rate: 1.5e-4
  min_lr: 1.5e-5
  warmup_steps: 2000
  weight_decay: 0.1
  max_grad_norm: 1.0
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  amp_dtype: bfloat16
  seed: 42
  compile: true          # torch.compile for speed
  checkpoint_dir: checkpoints/emily-base
  log_dir: logs/emily-base
  wandb_project: emily-slm
  wandb_run_name: emily-base
  wandb_enabled: false

dataset:
  train_path: datasets/tokenized/train.bin
  val_path: datasets/tokenized/val.bin
  max_seq_len: 1024
  num_workers: 8
  pin_memory: true
