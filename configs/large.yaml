# Emily SLM — Large Configuration
# ~350M parameters | 24 layers | 1024 hidden | 16 heads
# Purpose: High-capability model (80GB+ VRAM or multi-node)

model:
  name: emily-large
  vocab_size: 32000
  context_length: 2048
  d_model: 1024
  n_heads: 16
  n_kv_heads: 8          # GQA: 8 KV heads, 16 query heads
  n_layers: 24
  d_ff: 4096             # 4 * d_model
  dropout: 0.0           # No dropout for large models
  attention_type: flash   # Flash Attention mandatory
  tie_embeddings: true
  use_rms_norm: true
  use_swiglu: true
  use_rope: true
  rope_base: 10000
  max_seq_len: 2048

tokenizer:
  model_type: bpe
  vocab_size: 32000
  model_path: checkpoints/emily-large/tokenizer.json
  pad_token: "<|pad|>"
  eos_token: "<|eos|>"
  bos_token: "<|bos|>"
  unk_token: "<|unk|>"

training:
  batch_size: 8
  gradient_accumulation_steps: 16
  max_steps: 500000
  eval_interval: 10000
  save_interval: 20000
  log_interval: 500
  learning_rate: 6.0e-5
  min_lr: 6.0e-6
  warmup_steps: 10000
  weight_decay: 0.1
  max_grad_norm: 1.0
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  amp_dtype: bfloat16
  seed: 42
  compile: true
  checkpoint_dir: checkpoints/emily-large
  log_dir: logs/emily-large
  wandb_project: emily-slm
  wandb_run_name: emily-large
  wandb_enabled: false

dataset:
  train_path: datasets/tokenized/train.bin
  val_path: datasets/tokenized/val.bin
  max_seq_len: 2048
  num_workers: 16
  pin_memory: true
