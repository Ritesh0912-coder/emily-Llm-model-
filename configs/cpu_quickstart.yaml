# Emily SLM — CPU Quickstart Configuration
# Optimised for CPU / Windows training (no CUDA required)
# ~1M parameters | Trains on CPU in ~5-10 minutes

model:
  name: emily-tiny
  vocab_size: 4096
  context_length: 128
  d_model: 128
  n_heads: 4
  n_kv_heads: 4
  n_layers: 2
  d_ff: 512
  dropout: 0.0
  attention_type: standard
  tie_embeddings: true
  use_rms_norm: true
  use_swiglu: true
  use_rope: true
  rope_base: 10000
  max_seq_len: 128

tokenizer:
  model_type: bpe
  vocab_size: 4096
  model_path: checkpoints/emily-tiny/tokenizer.json

training:
  batch_size: 4
  gradient_accumulation_steps: 4   # effective batch = 16
  max_steps: 300
  eval_interval: 100
  save_interval: 100
  log_interval: 10
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  max_grad_norm: 1.0
  optimizer: adamw
  scheduler: cosine
  use_amp: false         # CPU — no AMP
  amp_dtype: float32
  seed: 42
  compile: false
  checkpoint_dir: checkpoints/emily-tiny
  log_dir: logs/emily-tiny
  wandb_project: emily-slm
  wandb_run_name: emily-tiny
  wandb_enabled: false

dataset:
  train_path: datasets/tokenized/train.bin
  val_path: datasets/tokenized/val.bin
  max_seq_len: 128
  num_workers: 0         # Windows — must be 0
  pin_memory: false      # CPU — no pin_memory
