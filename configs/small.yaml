# Emily SLM — Small Configuration
# ~10M parameters | 4 layers | 256 hidden | 8 heads
# Purpose: Consumer GPU training (4-8GB VRAM, ~1-2 hours)

model:
  name: emily-small
  vocab_size: 16384
  context_length: 512
  d_model: 256
  n_heads: 8
  n_kv_heads: 4          # GQA: 4 KV heads, 8 query heads
  n_layers: 4
  d_ff: 1024             # 4 * d_model
  dropout: 0.1
  attention_type: standard  # standard | flash
  tie_embeddings: true
  use_rms_norm: true
  use_swiglu: true
  use_rope: true
  rope_base: 10000
  max_seq_len: 512

tokenizer:
  model_type: bpe
  vocab_size: 16384
  model_path: checkpoints/emily-small/tokenizer.json
  pad_token: "<|pad|>"
  eos_token: "<|eos|>"
  bos_token: "<|bos|>"
  unk_token: "<|unk|>"

training:
  batch_size: 16
  gradient_accumulation_steps: 4
  max_steps: 50000
  eval_interval: 1000
  save_interval: 2000
  log_interval: 100
  learning_rate: 2.0e-4
  min_lr: 2.0e-5
  warmup_steps: 1000
  weight_decay: 0.1
  max_grad_norm: 1.0
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  amp_dtype: bfloat16
  seed: 42
  compile: false
  checkpoint_dir: checkpoints/emily-small
  log_dir: logs/emily-small
  wandb_project: emily-slm
  wandb_run_name: emily-small
  wandb_enabled: false

dataset:
  train_path: datasets/tokenized/train.bin
  val_path: datasets/tokenized/val.bin
  max_seq_len: 512
  num_workers: 4
  pin_memory: true
