# Emily SLM — Tiny Configuration
# ~1M parameters | 2 layers | 128 hidden | 4 heads
# Purpose: Unit testing and rapid iteration (trains on CPU in minutes)

model:
  name: emily-tiny
  vocab_size: 4096
  context_length: 256
  d_model: 128
  n_heads: 4
  n_kv_heads: 4          # Same as n_heads = standard MHA (set < n_heads for GQA)
  n_layers: 2
  d_ff: 512              # 4 * d_model
  dropout: 0.1
  attention_type: standard  # standard | flash
  tie_embeddings: true
  use_rms_norm: true
  use_swiglu: true
  use_rope: true
  rope_base: 10000
  max_seq_len: 256

tokenizer:
  model_type: bpe
  vocab_size: 4096
  model_path: checkpoints/emily-tiny/tokenizer.json
  pad_token: "<|pad|>"
  eos_token: "<|eos|>"
  bos_token: "<|bos|>"
  unk_token: "<|unk|>"

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 10000
  eval_interval: 500
  save_interval: 1000
  log_interval: 50
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 500
  weight_decay: 0.1
  max_grad_norm: 1.0
  optimizer: adamw
  scheduler: cosine
  use_amp: true
  amp_dtype: bfloat16
  seed: 42
  compile: false
  checkpoint_dir: checkpoints/emily-tiny
  log_dir: logs/emily-tiny
  wandb_project: emily-slm
  wandb_run_name: emily-tiny
  wandb_enabled: false

dataset:
  train_path: datasets/tokenized/train.bin
  val_path: datasets/tokenized/val.bin
  max_seq_len: 256
  num_workers: 4
  pin_memory: true
