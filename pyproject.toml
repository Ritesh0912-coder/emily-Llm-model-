[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emily-slm"
version = "0.1.0"
description = "Emily SLM — A production-quality GPT-style decoder-only transformer built from scratch in PyTorch"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emily AI Team" }]
keywords = ["language-model", "transformer", "nlp", "pytorch", "gpt", "slm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.19.0",
    "datasets>=2.18.0",
    "transformers>=4.40.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "gradio>=4.0.0",
    "tensorboard>=2.16.0",
    "wandb>=0.16.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]
flash = [
    "flash-attn>=2.5.0",
]

[project.scripts]
emily-train = "slm.cli.main:train"
emily-eval = "slm.cli.main:evaluate"
emily-chat = "slm.cli.main:chat"
emily-prepare = "slm.cli.main:prepare_data"

[tool.setuptools.packages.find]
where = ["."]
include = ["slm*"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008", "N812"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["slm"]
omit = ["tests/*", "scripts/*"]
